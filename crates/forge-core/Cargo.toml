[package]
name = "forge-core"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

# Vendor NPU/GPU delegates are opened during the capability probe. Android only:
# there is no delegate to load on desktop, where the profile is fixed to T0/CPU.
[target.'cfg(target_os = "android")'.dependencies]
libloading = "0.8"
