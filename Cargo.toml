[workspace]
resolver = "2"
members = [
    "crates/forge-core",
    "crates/forge-engines",
    "crates/forge-ffi",
    "crates/forge-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
ort = "=2.0.0-rc.12"
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
forge-core = { path = "crates/forge-core" }
forge-engines = { path = "crates/forge-engines" }
